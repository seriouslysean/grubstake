name: test

# The suite exists so a fix cannot silently break an earlier fix, which only holds if something
# other than memory runs it. This is the merge gate, and the suite downloads nothing, so no test
# result depends on GitHub being reachable. The download tier is network.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # The suite takes about 1.5 minutes on Linux and 3.5 on macOS; well past that means the run itself is stuck, not slow.
    timeout-minutes: 30
    strategy:
      # Both platforms report, because "it broke on the other one" is the answer worth having.
      fail-fast: false
      matrix:
        # The name a required status check is matched by, so it holds the alias and not the
        # runner label: renaming a label would leave the ruleset waiting on a check forever.
        include:
          # /bin/sh is dash here, so run.sh and grubstake.sh both execute under it.
          - platform: linux
            runner: ubuntu-24.04
          # /bin/sh is bash here, which is the other shell the script claims to support.
          - platform: macos
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: offline suite
        run: test/run.sh
