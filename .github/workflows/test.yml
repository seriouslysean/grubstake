name: test

# The suite exists so a fix cannot silently break an earlier fix, which only holds if something
# other than memory runs it. This is the merge gate, and the suite downloads nothing, so no test
# result depends on GitHub being reachable. The download tier is network.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # The suite takes about 1.5 minutes on Linux and 3.5 on macOS; well past that means the run itself is stuck, not slow.
    timeout-minutes: 30
    strategy:
      # Both platforms report, because "it broke on the other one" is the answer worth having.
      fail-fast: false
      matrix:
        # The name a required status check is matched by, so it holds the alias and not the
        # runner label: renaming a label would leave the ruleset waiting on a check forever.
        include:
          # /bin/sh is dash here, so run.sh and grubstake.sh both execute under it.
          - platform: linux
            runner: ubuntu-24.04
          # /bin/sh is bash here, which is the other shell the script claims to support.
          - platform: macos
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: offline suite
        run: test/run.sh

  # Runs lint.yml as a job so the merge job below can wait on it. It stays a separate,
  # non-required check: only the merge job depends on it.
  lint:
    uses: ./.github/workflows/lint.yml

  # Squash-merges a Dependabot PR once the jobs above pass, if every update is a
  # patch or minor (fastify/github-action-merge-dependabot, pinned to v3.15.0).
  # Majors and anything not Dependabot's stay open for a person. network.yml is
  # not a dependency: it only runs on a pull request touching grubstake.sh, which
  # Dependabot never edits.
  automerge:
    name: Dependabot auto-merge
    needs: [test, lint]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge minor and patch updates
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          target: minor
          merge-method: squash
