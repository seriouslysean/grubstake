name: test

# The suite exists so a fix cannot silently break an earlier fix, which only holds if something
# other than memory runs it. This is the merge gate, and the suite downloads nothing, so no test
# result depends on GitHub being reachable. The download tier is network.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # The suite takes about 1.5 minutes on Linux and 3.5 on macOS; well past that means the run itself is stuck, not slow.
    timeout-minutes: 30
    strategy:
      # Both platforms report, because "it broke on the other one" is the answer worth having.
      fail-fast: false
      matrix:
        # The name a required status check is matched by, so it holds the alias and not the
        # runner label: renaming a label would leave the ruleset waiting on a check forever.
        include:
          # /bin/sh is dash here, so run.sh and grubstake.sh both execute under it.
          - platform: linux
            runner: ubuntu-24.04
          # /bin/sh is bash here, which is the other shell the script claims to support.
          - platform: macos
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: offline suite
        run: test/run.sh

  # Runs lint.yml as a job so the merge job below can wait on it. It stays a separate,
  # non-required check: only the merge job depends on it.
  lint:
    uses: ./.github/workflows/lint.yml

  # Squash-merges a Dependabot PR once the jobs above pass, if the update is a
  # patch or minor: GitHub's documented pattern (dependabot/fetch-metadata, then
  # gh pr merge), pinned to the head that was checked. Majors and anything not
  # Dependabot's stay open for a person. A new PR job goes in needs: too, or
  # this merges before it finishes.
  automerge:
    name: 'Dependabot auto-merge'
    needs: [test, lint]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Read the update type'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: 'Merge minor and patch updates'
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
