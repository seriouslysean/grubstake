name: lint

# Not required: it downloads a pinned toolchain, and a fetch failing on GitHub being slow must
# not block a merge that test.yml's offline suite already gates. See test/lint.sh for the pins.

# Pull requests run it as a job of test.yml, so the Dependabot merge job can wait on it.
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    # Cold-cache downloads plus four tools' worth of static analysis over the whole tree.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lint
        run: test/lint.sh
